version: "3.8"

services:
  # Rust Cargo DOS Commander - runtime
  # NOTE: This is a desktop GUI application (tkinter).
  # Docker is provided for build validation and CI testing only.
  # For actual usage, run natively: cd backend && python main.py
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: cargo-commander
    ports:
      - "9999:9999"
    volumes:
      - rust_projects:/root/rust_projects
    environment:
      - DISPLAY=${DISPLAY:-:0}
    restart: "no"

  # Test service - runs headless tests (smoke + unit + coverage)
  # Usage: docker-compose run --rm test
  #        docker-compose run --rm test smoke
  #        docker-compose run --rm test test
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    container_name: cargo-commander-test
    volumes:
      - ./backend:/app:ro
      - rust_projects:/root/rust_projects
    command: ["all"]
    profiles:
      - test

volumes:
  rust_projects:
    driver: local
