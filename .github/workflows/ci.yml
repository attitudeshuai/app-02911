name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk \
            xvfb \
            scrot
        shell: bash

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # tcl-tk is usually pre-installed on macOS runners
          brew install tcl-tk 2>/dev/null || true

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify tkinter availability
        run: python -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: Smoke test (headless check)
        working-directory: backend
        run: python main.py --check

      - name: Run unit tests (Linux with Xvfb)
        if: runner.os == 'Linux'
        working-directory: backend
        run: |
          xvfb-run -a python -m pytest tests/ -v --tb=short

      - name: Run unit tests (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

      - name: Test single command execution
        working-directory: backend
        run: python main.py -c "echo CI test passed"

      - name: Test help command
        working-directory: backend
        run: python main.py -c "help"

      - name: Test version flag
        working-directory: backend
        run: python main.py --version
