name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test:
    name: lint & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install tcl/tk (macOS)
        if: runner.os == 'macOS'
        run: brew install python-tk@3.12

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check backend

      - name: Ruff format check
        run: ruff format --check backend

      - name: Headless tests
        run: pytest -q -m "not gui and not cargo" backend/tests

      - name: GUI tests (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q -m gui backend/tests

      - name: GUI smoke launch (non-Linux)
        if: runner.os != 'Linux'
        run: python backend/main.py --smoke
