name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: 'nightly'

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk \
            xvfb \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0
        shell: bash

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tcl-tk 2>/dev/null || true

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run smoke test
        working-directory: backend
        run: python main.py --check

      - name: Run unit tests (Linux with Xvfb)
        if: runner.os == 'Linux'
        working-directory: backend
        run: xvfb-run -a python -m pytest tests/ -v --tb=short

      - name: Run unit tests (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

      - name: Build with PyInstaller
        working-directory: backend
        run: pyinstaller cargo_commander.spec --clean --noconfirm

      - name: Test built executable (Linux)
        if: runner.os == 'Linux'
        working-directory: backend/dist
        run: |
          chmod +x CargoCommander
          xvfb-run -a ./CargoCommander --check

      - name: Test built executable (Windows)
        if: runner.os == 'Windows'
        working-directory: backend/dist
        run: .\CargoCommander.exe --check
        shell: pwsh

      - name: Test built executable (macOS)
        if: runner.os == 'macOS'
        working-directory: backend/dist
        run: |
          chmod +x CargoCommander
          ./CargoCommander --check

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        working-directory: backend/dist
        run: |
          tar -czf CargoCommander-linux-x64.tar.gz CargoCommander
          ls -lh CargoCommander-linux-x64.tar.gz

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: backend/dist
        run: |
          Compress-Archive -Path CargoCommander.exe -DestinationPath CargoCommander-win-x64.zip
          Get-Item CargoCommander-win-x64.zip | Select-Object Name, Length
        shell: pwsh

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        working-directory: backend/dist
        run: |
          tar -czf CargoCommander-macos-$(uname -m).tar.gz CargoCommander
          ls -lh CargoCommander-macos-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CargoCommander-${{ runner.os }}
          path: |
            backend/dist/CargoCommander-*.tar.gz
            backend/dist/CargoCommander-*.zip
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
