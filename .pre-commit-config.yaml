repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2048']

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: ^backend/
        args: ['--max-line-length=120', '--extend-ignore=E203,W503']

  - repo: local
    hooks:
      - id: precommit-checks
        name: Pre-commit checks (imports + selftest + unit)
        entry: python scripts/precommit_checks.py
        language: system
        pass_filenames: false
        types: [python]
