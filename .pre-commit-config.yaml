# Local quality gate. Install once with:  pre-commit install
# Then every commit runs: ruff lint+format + headless basic-command tests.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml

  - repo: local
    hooks:
      - id: pytest-smoke
        name: basic-command tests (headless)
        entry: python -m pytest -q -m "not gui and not cargo" backend/tests
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
